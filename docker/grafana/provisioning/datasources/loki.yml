apiVersion: 1

datasources:
  - name: Loki
    uid: loki
    type: loki
    access: proxy
    url: http://loki:3100
    editable: false
    jsonData:
      maxLines: 1000
      derivedFields:
        - name: service_name
          matcherRegex: ^service_name$
          matcherType: label
          url: '{ resource.service.name = "$${__value.raw}" }'
          datasourceUid: tempo
          urlDisplayLabel: View traces
