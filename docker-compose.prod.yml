name: ${APP_NAME}_prod

services:
  postgres:
    image: postgres:17-alpine
    container_name: ${APP_NAME}_prod_postgres
    env_file:
      - .env.prod
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 10s
      retries: 5

  alloy:
    image: grafana/alloy:v1.14.2
    container_name: ${APP_NAME}_prod_alloy
    env_file:
      - .env.prod
    command:
      - run
      - /etc/alloy/config.alloy
      - --storage.path=/var/lib/alloy/data
      - --server.http.listen-addr=0.0.0.0:12345
    ports:
      - "${ALLOY_PORT:-12345}:12345"
      - "${OTLP_GRPC_PORT:-4317}:4317"
      - "${OTLP_HTTP_PORT:-4318}:4318"
    volumes:
      - alloy_data:/var/lib/alloy/data
      - ./docker/alloy:/etc/alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      - postgres
      - tempo
      - loki

  loki:
    image: grafana/loki:3.7
    container_name: ${APP_NAME}_prod_loki
    env_file:
      - .env.prod
    user: "0"
    command:
      - -config.file=/etc/loki/loki.yaml
    ports:
      - "${LOKI_PORT:-3100}:3100"
    volumes:
      - loki_data:/tmp/loki
      - ./docker/loki/loki.yaml:/etc/loki/loki.yaml:ro

  prometheus:
    image: prom/prometheus:v3.10.0
    container_name: ${APP_NAME}_prod_prometheus
    env_file:
      - .env.prod
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --web.enable-lifecycle
      - --web.enable-remote-write-receiver
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    volumes:
      - prometheus_data:/prometheus
      - ./docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro

  tempo:
    image: grafana/tempo:2.10.3
    container_name: ${APP_NAME}_prod_tempo
    env_file:
      - .env.prod
    command:
      - -config.file=/etc/tempo.yaml
    ports:
      - "${TEMPO_PORT:-3200}:3200"
    volumes:
      - tempo_data:/var/tempo
      - ./docker/tempo/tempo.yaml:/etc/tempo.yaml:ro

  grafana:
    image: grafana/grafana-oss:12.4.2
    container_name: ${APP_NAME}_prod_grafana
    env_file:
      - .env.prod
    ports:
      - "${GRAFANA_PORT:-3000}:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./docker/grafana/provisioning:/etc/grafana/provisioning:ro
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
    depends_on:
      - alloy
      - prometheus
      - tempo
      - loki

  alembic:
    container_name: ${APP_NAME}_prod_alembic
    env_file:
      - .env.prod
    image: ghcr.io/arynyklas/tma-template/tma-template/backend:${BACKEND_TAG:-main-latest}
    environment:
      SENTRY_RELEASE: ${SENTRY_RELEASE}
      SENTRY_ENVIRONMENT: ${SENTRY_ENVIRONMENT}
    entrypoint: ["/app/entrypoint-alembic.sh"]
    volumes:
      - ./config-prod.yaml:/app/config.yaml:ro
    depends_on:
      postgres:
        condition: service_healthy
      alloy:
        condition: service_started

  bot:
    container_name: ${APP_NAME}_prod_bot
    env_file:
      - .env.prod
    image: ghcr.io/arynyklas/tma-template/tma-template/backend:${BACKEND_TAG:-main-latest}
    environment:
      SENTRY_RELEASE: ${SENTRY_RELEASE}
      SENTRY_ENVIRONMENT: ${SENTRY_ENVIRONMENT}
    entrypoint: ["/app/entrypoint-bot.sh"]
    volumes:
      - ./config-prod.yaml:/app/config.yaml:ro
    depends_on:
      alembic:
        condition: service_completed_successfully
      alloy:
        condition: service_started

  api:
    container_name: ${APP_NAME}_prod_api
    env_file:
      - .env.prod
    image: ghcr.io/arynyklas/tma-template/tma-template/backend:${BACKEND_TAG:-main-latest}
    entrypoint: ["/app/entrypoint-api.sh"]
    ports:
      - "8080:8080"
    environment:
      API_WORKERS: ${API_WORKERS}
      SENTRY_RELEASE: ${SENTRY_RELEASE}
      SENTRY_ENVIRONMENT: ${SENTRY_ENVIRONMENT}
    volumes:
      - ./config-prod.yaml:/app/config.yaml:ro
    depends_on:
      alembic:
        condition: service_completed_successfully
      alloy:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

volumes:
  postgres_data:
  alloy_data:
  loki_data:
  prometheus_data:
  tempo_data:
  grafana_data:
